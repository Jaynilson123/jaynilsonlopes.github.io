<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Explorer | Jaynilson Lopes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* OS Desktop Background */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        /* The File Explorer Window */
        .window { 
            width: 90%; 
            max-width: 1100px; 
            height: 85vh; 
            background-color: #202020; 
            border: 1px solid #444; 
            border-radius: 8px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); 
        }

        /* Top Title Bar */
        .title-bar { 
            height: 35px; 
            background-color: #181818; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            font-size: 13px; 
            user-select: none; 
            border-bottom: 1px solid #000; 
        }
        .title-bar-text { flex-grow: 1; display: flex; align-items: center; gap: 8px; }
        .title-bar-controls { display: flex; gap: 15px; color: #aaa; }
        .title-bar-controls i:hover { color: #fff; cursor: pointer; }

        /* Toolbar / Address Bar */
        .toolbar { 
            height: 45px; 
            background-color: #202020; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            border-bottom: 1px solid #333; 
            gap: 15px; 
        }
        .address-bar { 
            background-color: #191919; 
            padding: 6px 15px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 14px; 
            color: #ccc;
        }
        
        .back-btn {
            color: white; 
            text-decoration: none; 
            padding: 6px 12px; 
            background: #0078d4; 
            border-radius: 4px; 
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }
        .back-btn:hover { background: #005a9e; }

        /* Layout Structure */
        .main-area { display: flex; flex-grow: 1; overflow: hidden; }
        
        /* Left Sidebar */
        .sidebar { 
            width: 250px; 
            border-right: 1px solid #333; 
            padding: 10px 0; 
            overflow-y: auto; 
            font-size: 14px; 
            background-color: #202020;
        }
        .sidebar-item { 
            padding: 8px 20px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #ccc;
        }
        .sidebar-item:hover { background-color: #2d2d2d; }
        .sidebar-item.active { background-color: #2d2d2d; color: #fff; border-left: 3px solid #0078d4; }
        
        /* Main Content Grid */
        .content-area { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            background-color: #191919; 
        }
        .file-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
        }
        .file-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            cursor: pointer; 
            padding: 15px 10px; 
            border-radius: 4px; 
            border: 1px solid transparent; 
            transition: 0.1s;
        }
        .file-item:hover { background-color: #2d2d2d; border-color: #444; }
        .file-icon { 
            width: 90px; 
            height: 90px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 10px; 
        }
        .file-icon img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 4px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .file-name { 
            font-size: 13px; 
            color: #ccc; 
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Status Messages */
        .loading { grid-column: 1 / -1; text-align: center; color: #888; padding: 40px; font-size: 15px; }

        /* Full Screen Photo Viewer Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; }
        .modal img, .modal video { max-width: 90%; max-height: 90%; border-radius: 4px; box-shadow: 0 5px 25px rgba(0,0,0,0.8); }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #ccc; cursor: pointer; transition: 0.2s;}
        .close-modal:hover { color: #fff; transform: scale(1.1); }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .window { width: 100%; height: 100vh; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

    <div class="window">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-text">
                <i class="fas fa-folder-open" style="color: #e6c875;"></i> Projects
            </div>
            <div class="title-bar-controls">
                <i class="fas fa-minus"></i>
                <i class="far fa-window-maximize"></i>
                <i class="fas fa-times"></i>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <i class="fas fa-arrow-left" style="color: #666;"></i>
            <i class="fas fa-arrow-right" style="color: #666;"></i>
            <i class="fas fa-arrow-up" style="color: #aaa;"></i>
            <i class="fas fa-sync-alt" style="color: #aaa; cursor: pointer;" onclick="loadFiles()" title="Refresh Folder"></i>
            
            <div class="address-bar">
                <i class="fas fa-desktop" style="color: #4daafc;"></i> > This PC > GitHub > Media > Projects
            </div>
            
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> Main Website</a>
        </div>

        <!-- Main Layout -->
        <div class="main-area">
            <!-- Sidebar Navigation -->
            <div class="sidebar">
                <div class="sidebar-item"><i class="fas fa-star" style="color: #e6c875;"></i> Quick access</div>
                <div class="sidebar-item"><i class="fas fa-desktop" style="color: #4daafc;"></i> This PC</div>
                <div style="padding-left: 20px;">
                    <div class="sidebar-item"><i class="fas fa-images" style="color: #4daafc;"></i> Pictures</div>
                    <div class="sidebar-item"><i class="fas fa-file-alt" style="color: #4daafc;"></i> Documents</div>
                    <div class="sidebar-item active"><i class="fas fa-folder-open" style="color: #e6c875;"></i> Media Directory</div>
                </div>
            </div>
            
            <!-- File Grid -->
            <div class="content-area">
                <div class="file-grid" id="file-grid">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Scanning repository for files...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image/Video Pop-up Viewer -->
    <div class="modal" id="mediaModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>

    <script>
        // GitHub API Configuration
        const repo = 'Jaynilson123/jaynilsonlopes.github.io';
        const folder = 'media';
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${folder}`;
        
        const fileGrid = document.getElementById('file-grid');
        const modal = document.getElementById('mediaModal');
        const modalContent = document.getElementById('modalContent');

        // Automatically fetch and generate the file explorer
        async function loadFiles() {
            fileGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading files...</div>';
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Could not access the GitHub folder.');
                const files = await response.json();
                
                fileGrid.innerHTML = '';
                
                // Fixed filter: Only hides exact profile picture and any file with "resume" in the name
                const mediaFiles = files.filter(file => {
                    const fileName = file.name.toLowerCase();
                    const isMedia = fileName.match(/\.(jpg|jpeg|png|gif|mp4)$/i);
                    
                    const isHidden = (fileName === 'image_d0d510.png') || fileName.includes('resume');
                                     
                    return isMedia && !isHidden;
                });

                if (mediaFiles.length === 0) {
                    fileGrid.innerHTML = '<div class="loading">No files found. Upload some to your GitHub "media" folder!</div>';
                    return;
                }

                mediaFiles.forEach(file => {
                    const isVideo = file.name.endsWith('.mp4');
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    
                    // Allow clicking to view full size
                    div.onclick = () => openModal(file.download_url, isVideo);

                    let previewHTML = '';
                    if (isVideo) {
                        previewHTML = `<i class="fas fa-file-video" style="font-size: 50px; color: #0078d4;"></i>`;
                    } else {
                        previewHTML = `<img src="media/${file.name}" alt="${file.name}" loading="lazy">`;
                    }

                    div.innerHTML = `
                        <div class="file-icon">
                            ${previewHTML}
                        </div>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                    `;
                    fileGrid.appendChild(div);
                });
            } catch (error) {
                console.error('Error:', error);
                fileGrid.innerHTML = `
                    <div class="loading" style="color: #e74c3c;">
                        <i class="fas fa-exclamation-triangle"></i> Failed to load files.<br><br>
                        Make sure the "media" folder exists in your GitHub repository and has images in it.
                    </div>`;
            }
        }

        // Modal Controls
        function openModal(url, isVideo) {
            if (isVideo) {
                modalContent.innerHTML = `<video controls autoplay src="${url}" style="max-width: 90%; max-height: 90%;"></video>`;
            } else {
                modalContent.innerHTML = `<img src="${url}">`;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            modalContent.innerHTML = '';
        }

        // Click outside the image to close it
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Run the script immediately when the page loads
        loadFiles();
    </script>
</body>
</html>
