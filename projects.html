<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Files | Jaynilson Lopes</title>
    
    <!-- Google Fonts for Dossier Typewriter & Authentic Handwriting -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        /* The Desk (Background) */
        body {
            /* Matched to the main page dark blue gradient */
            background: linear-gradient(to bottom, #0f2a4a, #2c4a68); 
            background-attachment: fixed;
            font-family: 'Special Elite', 'Courier New', monospace; /* Updated Font */
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        /* The Manila Folder Container */
        .folder-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* The Folder Tab */
        .folder-tab {
            background-color: #e6c875; /* Classic Manila color */
            width: 220px;
            height: 45px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #4a3b14;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #cfaa54;
            border-bottom: none;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.4);
        }

        /* The Main Folder Body */
        .folder-body {
            background-color: #e6c875;
            border-radius: 0 12px 12px 12px;
            padding: 50px 40px;
            box-shadow: 10px 15px 30px rgba(0,0,0,0.5);
            min-height: 600px;
            position: relative;
            border: 1px solid #cfaa54;
        }

        /* Header & Navigation inside the folder */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 2px dashed #cfaa54;
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #3a2e0f;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            color: #6a5621;
            margin-top: 5px;
        }

        /* Back to Resume Button */
        .back-btn {
            background-color: #3a2e0f;
            color: #e6c875;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s ease-in-out;
        }

        .back-btn:hover {
            background-color: #1a1405;
            color: #fff;
        }

        /* The Photo Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        /* Individual Photo Styling (Polaroid look) */
        .photo-card {
            background: #fff;
            padding: 15px 15px 40px 15px; /* Extra padding on bottom for the label */
            box-shadow: 2px 4px 10px rgba(0,0,0,0.2);
            border-radius: 2px;
            text-align: center;
            transition: transform 0.2s ease-in-out;
            position: relative;
        }

        /* Slight random rotations to look like scattered photos */
        .photo-card:nth-child(odd) { transform: rotate(-2deg); }
        .photo-card:nth-child(even) { transform: rotate(3deg); }
        .photo-card:hover { transform: rotate(0deg) scale(1.05); z-index: 10; box-shadow: 5px 8px 15px rgba(0,0,0,0.3); }

        /* The actual images */
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #ddd; /* Placeholder color if image is missing */
            border: 1px solid #eee;
        }

        /* Handwritten-style labels for the photos */
        .photo-label {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            font-family: 'Caveat', cursive; /* Updated Font */
            font-size: 1.4rem; 
            color: #333;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 600px) {
            header { flex-direction: column; gap: 20px; }
            .folder-body { padding: 30px 20px; }
            .folder-tab { width: 180px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="folder-container">
        <div class="folder-tab">
            PROJECT FILES
        </div>

        <div class="folder-body">
            
            <header>
                <div>
                    <h1>Jaynilson Lopes</h1>
                    <div class="subtitle">Project & Fabrication Gallery</div>
                </div>
                <a href="https://jaynilson123.github.io/jaynilsonlopes.github.io/" class="back-btn">← Back to Resume</a>
            </header>

            <div class="gallery-grid">
                
                <div class="photo-card">
                    <img src="c-clamp.jpg" alt="Machine Shop C-Clamp">
                    <div class="photo-label">Machine Shop C-Clamp</div>
                </div>

                <div class="photo-card">
                    <img src="transmission.jpg" alt="Transmission Case Study">
                    <div class="photo-label">Nissan Transmission Study</div>
                </div>

                <div class="photo-card">
                    <img src="solar-project.jpg" alt="Solar O&M">
                    <div class="photo-label">Solar O&M Prep</div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
